<!DOCTYPE html>

<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>マイページ</title>

    <link rel="stylesheet"
          th:href="@{/CSS/mypage.css}">

</head>

<body>


<!-- ユーザー情報 -->

<div class="Container">

    <div class="Name">
        <h1>名前</h1>
        <span th:text="${name}"></span>
    </div>

    <div class="Age">
        <h1>年齢</h1>
        <span th:text="${age}"></span>
    </div>

    <div class="Grade">
        <h1>学年</h1>
        <span th:text="${grade}"></span>
    </div>

    <div class="prefecture">
        <h1>住んでる都道府県</h1>
        <span th:text="${prefecture}"></span>
    </div>

    <div class="Email">
        <h1>メールアドレス</h1>
        <span th:text="${loginMail}"></span>
    </div>

</div>


<!-- 診断履歴 -->

<section>

    <h2>診断履歴</h2>

    <div th:if="${#lists.isEmpty(diagnosisResults)}">

        <p>
            まだ診断履歴がありません。
        </p>

    </div>


    <div th:each="result : ${diagnosisResults}">

        <div class="diagnosis-history">

            <p>
                診断日時：
                <span th:text="${result.createdAt}"></span>
            </p>

            <h3>
                おすすめ理由
            </h3>

            <p th:text="${result.reason}"></p>

            <h3>
                おすすめされた学校
            </h3>


            <!-- 診断履歴削除フォーム -->

            <form th:action="@{/diagnosis/delete}"
                  method="post"
                  class="delete-form">

                <input type="hidden"
                       name="id"
                       th:value="${result.id}">

                <button type="button"
                        class="delete-button"
                        onclick="openDeleteModal(this)">

                    削除

                </button>

            </form>

        </div>

    </div>


    <!-- 診断履歴削除モーダル -->

    <div id="diagnosisDeleteModal"
         class="modal">

        <div class="modal-content">

            <h2>
                診断履歴を削除
            </h2>

            <p>
                この診断履歴を削除しますか？
            </p>

            <div class="modal-buttons">

                <button type="button"
                        class="cancel-button"
                        onclick="closeDeleteModal()">

                    キャンセル

                </button>

                <button type="button"
                        class="confirm-delete-button"
                        onclick="submitDelete()">

                    削除する

                </button>

            </div>

        </div>

    </div>

</section>


<!-- お気に入り -->

<section>

    <h2>
        お気に入りの学校
    </h2>


    <div th:if="${#lists.isEmpty(favoriteSchoolList)}">

        <p>
            まだお気に入りの学校がありません。
        </p>

    </div>


    <div th:each="item : ${favoriteSchoolList}"
         class="favorite-school">

        <div>

            <h3 th:text="${item.school.name}">
                学校名
            </h3>

            <p th:text="${item.school.location}">
                所在地
            </p>

        </div>


        <!-- 学校詳細 -->

        <a th:href="@{/schools/{code}(code=${item.school.code})}">

            詳細を見る

        </a>


        <!-- お気に入り削除フォーム -->

        <form th:action="@{/mypage/favorite/delete}"
              method="post"
              class="favorite-delete-form">

            <input type="hidden"
                   name="id"
                   th:value="${item.favorite.id}">

            <button type="button"
                    class="delete-button"
                    onclick="openFavoriteDeleteModal(this)">

                削除

            </button>

        </form>

    </div>


    <!-- お気に入り削除モーダル -->

    <div id="favoriteDeleteModal"
         class="modal">

        <div class="modal-content">

            <h2>
                お気に入りから学校を削除
            </h2>

            <p>
                お気に入りから削除しますか？
            </p>

            <div class="modal-buttons">

                <button type="button"
                        class="cancel-button"
                        onclick="closeFavoriteDeleteModal()">

                    キャンセル

                </button>

                <button type="button"
                        class="confirm-delete-button"
                        onclick="submitFavoriteDelete()">

                    削除する

                </button>

            </div>

        </div>

    </div>

</section>


<!-- ログアウト -->

<form th:action="@{/logout}"
      method="post">

    <button type="submit">
        ログアウト
    </button>

</form>


<!-- ホームに戻る -->

<div class="Back">

    <a th:href="@{/home}">
        ← ホームに戻る
    </a>

</div>


<script th:src="@{/CSS/JS/delete.js}">
</script>


</body>

</html>
