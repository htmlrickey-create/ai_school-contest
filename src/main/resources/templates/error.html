<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>エラーが発生しました</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: sans-serif;
            background: #f7f7f7;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 120px auto;
            padding: 40px 30px;
            background: white;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
        }

        p {
            line-height: 1.8;
            color: #666;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 28px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>エラーが発生しました</h1>

    <p>
        申し訳ありません。<br>
        処理中に問題が発生しました。
    </p>

    <p>
        もう一度お試しください。
    </p>

    <a href="/home" class="button">
        ホームに戻る
    </a>

</div>

</body>
</html>
